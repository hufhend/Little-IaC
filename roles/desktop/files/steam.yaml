# Steam Game platform
- name: Package Variable Setting
  ansible.builtin.set_fact:
    app: "steam"
    app_name: "Steam client"

- name: Install {{ app_name }}
  block:
    - name: Check if i386 architecture is added
      ansible.builtin.command:
        cmd: dpkg --print-foreign-architectures
      register: dpkg_arch
      changed_when: false

    - name: Add i386 architecture
      ansible.builtin.command:
        cmd: dpkg --add-architecture i386
      when: "'i386' not in dpkg_arch.stdout_lines"

    - name: Add {{ app_name }} GPG key
      ansible.builtin.get_url:
        url: https://repo.steampowered.com/steam/archive/stable/steam.gpg
        dest: /usr/share/keyrings/steam.gpg
        mode: "0644"

    - name: Add {{ app_name }} repository
      ansible.builtin.deb822_repository:
        name: steam
        types:
          - deb
          - deb-src
        uris: https://repo.steampowered.com/steam/
        suites: stable
        components: steam
        architectures:
          - amd64
          - i386
        signed_by: /usr/share/keyrings/steam.gpg
        state: present

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Install {{ app_name }}
      ansible.builtin.apt:
        name: steam
        state: present
  when: steam == true
