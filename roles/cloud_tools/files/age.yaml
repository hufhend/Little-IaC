# A simple, modern and secure encryption tool
---
- name: Age file encryption tool Variable Setting
  ansible.builtin.set_fact:
    app: "age"
    app_name: "Age encryption"

- name: Install {{ app_name }}
  block:
    - name: Install {{ app_name }}
      ansible.builtin.command: "{{ app_dir }}/binenv install {{ app }}"
      args:
        creates: "{{ app_dir }}/{{ app }}"

    - name: Install {{ app }}-keygen
      ansible.builtin.command: "{{ app_dir }}/binenv install {{ app }}-keygen"
      args:
        creates: "{{ app_dir }}/{{ app }}-keygen"

    - name: Check {{ app_name }} version
      ansible.builtin.command: "{{ app_dir }}/{{ app }} --version"
      register: "install_result"
      changed_when: false

    - name: Extract and clean version
      ansible.builtin.set_fact:
        new_version: "{{ install_result.stdout | regex_replace('^v', '') | trim }}"

    - name: Show {{ app_name }} version
      ansible.builtin.debug:
        msg: "{{ app_name }} v{{ new_version }} is installed."

  when:
    - age | default(false) | bool
    - binenv | default(false) | bool
