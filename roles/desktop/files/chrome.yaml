# Chrome browser
- name: Chrome Variable Setting
  ansible.builtin.set_fact:
    app: "chrome"
    app_name: "Google Chrome"

- name: Install {{ app_name }}
  block:
    # Ubuntu/Debian installation block
    - name: Install {{ app_name }} on Ubuntu/Debian
      block:
        - name: Add {{ app_name }} GPG key
          ansible.builtin.get_url:
            url: https://dl.google.com/linux/linux_signing_key.pub
            dest: /usr/share/keyrings/google-chrome.asc
            mode: "0644"

        - name: Add {{ app_name }} repository
          ansible.builtin.deb822_repository:
            name: google-chrome
            types: deb
            uris: http://dl.google.com/linux/chrome/deb/
            suites: stable
            components: main
            architectures: amd64
            signed_by: /usr/share/keyrings/google-chrome.asc
            state: present

        - name: Install {{ app_name }}
          ansible.builtin.apt:
            name: google-chrome-stable
            state: present
      when: ansible_facts["os_family"] == "Debian"

    # RedHat installation block
    - name: Install {{ app_name }} on RedHat
      block:
        - name: Add {{ app_name }} repository
          ansible.builtin.yum_repository:
            name: google-chrome
            description: Google Chrome
            baseurl: http://dl.google.com/linux/chrome/rpm/stable/x86_64
            enabled: yes
            gpgcheck: yes
            gpgkey: https://dl.google.com/linux/linux_signing_key.pub

        - name: Install {{ app_name }}
          ansible.builtin.dnf:
            name: google-chrome-stable
            state: present
      when: ansible_facts["os_family"] == "RedHat"

  when: chrome == true
