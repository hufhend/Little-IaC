---
# NVIDIA Container Toolkit - ultra simple installation

# 1. CHECK GPU
- name: Check if NVIDIA driver works
  ansible.builtin.command: nvidia-smi
  register: nvidia_check
  failed_when: false
  changed_when: false

- name: Abort if no GPU
  ansible.builtin.fail:
    msg: "No NVIDIA GPU found"
  when:
    - nvidia_toolkit | default(false)
    - nvidia_check.rc != 0

# 2. ADD NVIDIA REPOSITORY
- name: Add NVIDIA repository
  block:
    - name: Add GPG key
      ansible.builtin.apt_key:
        url: https://nvidia.github.io/libnvidia-container/gpgkey
        keyring: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg

    - name: Add repo
      ansible.builtin.apt_repository:
        repo: deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /
        filename: nvidia-container-toolkit

    - name: Update cache
      ansible.builtin.apt:
        update_cache: yes
  when:
    - nvidia_toolkit | default(false)
    - ansible_facts["os_family"] == "Debian"

# 3. INSTALL NVIDIA CONTAINER TOOLKIT
- name: Install NVIDIA Container Toolkit
  ansible.builtin.apt:
    name:
      - nvidia-container-toolkit
      - nvidia-container-toolkit-base
      - libnvidia-container-tools
      - libnvidia-container1
    state: latest
    allow_downgrade: yes
  when:
    - nvidia_toolkit | default(false)
    - nvidia_check.rc == 0
    - ansible_facts["os_family"] == "Debian"

# 4. CONFIGURE CONTAINERD
- name: Configure containerd for GPU
  ansible.builtin.command:
    cmd: nvidia-ctk runtime configure --runtime=containerd
    creates: /etc/containerd/conf.d/99-nvidia.toml
  notify: restart containerd
  when:
    - nvidia_toolkit | default(false)
    - nvidia_check.rc == 0

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: yes
    state: started
  when:
    - nvidia_toolkit | default(false)
    - nvidia_check.rc == 0

# 5. VERIFICATION
- name: Display success message
  ansible.builtin.debug:
    msg: "✅ NVIDIA GPU ready for containers"
  when:
    - nvidia_toolkit | default(false)
    - nvidia_check.rc == 0