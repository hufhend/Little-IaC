# Argo CD is a declarative, GitOps continuous delivery tool for Kubernetes
---
- name: Argo CD Variable Setting
  ansible.builtin.set_fact:
    app: "argocd"
    app_name: "Argo CD"

- name: Install {{ app_name }}
  when:
    - argocd | default(false) | bool
    - binenv | default(false) | bool
  block:
    - name: Install {{ app_name }}
      ansible.builtin.command: "{{ app_dir }}/binenv install {{ app }}"
      args:
        creates: "{{ app_dir }}/{{ app }}"

    # Generate completion script (idempotent, single task)
    - name: Ensure bash completion script for {{ app }}
      ansible.builtin.shell: >
        {{ app_dir }}/{{ app }} completion bash > /etc/bash_completion.d/{{ app }}
      args:
        creates: "/etc/bash_completion.d/{{ app }}"
      changed_when: true

    # Show installed version
    - name: Detect {{ app_name }} version
      block:
        - name: Check {{ app_name }} version
          ansible.builtin.command: "{{ app_dir }}/{{ app }} version --client -o json"
          register: install_result
          changed_when: false
          failed_when: false

        - name: Extract and clean version
          ansible.builtin.set_fact:
            new_version: >-
              {{
                (install_result.stdout | from_json).client.Version
                | default((install_result.stdout | from_json).client.version)
                | regex_replace('^v|\+.*$', '')
              }}
          when: install_result.rc == 0

        - name: Show {{ app_name }} version
          ansible.builtin.debug:
            msg: "{{ app_name }} v{{ new_version }} is installed."
          when: install_result.rc == 0

        - name: Warn – unable to detect {{ app_name }} version
          ansible.builtin.debug:
            msg: >-
              Could not detect {{ app_name }} version (rc={{ install_result.rc }}).
              stderr: {{ install_result.stderr | default('') }}
            warn: true
          when: install_result.rc != 0
      rescue:
        - name: Warn – version detection block failed
          ansible.builtin.debug:
            msg: "Version detection for {{ app_name }} failed unexpectedly."
            warn: true
