# A simple, modern and secure encryption tool
---
- name: Age file encryption tool Variable Setting
  ansible.builtin.set_fact:
    app: "age"
    app_name: "Age encryption"
    version: "{{ age_version | default('', true) }}"

- name: Install
  block:
    # Determine the latest available version from the binenv index
    - name: Get available {{ app_name }} versions
      ansible.builtin.command: "{{ app_dir }}/binenv versions {{ app }}"
      register: binenv_versions_raw
      changed_when: false

    - name: Set latest version
      ansible.builtin.set_fact:
        latest_version: >-
          {{ binenv_versions_raw.stdout
            | regex_replace('\x1b\[[0-9;]*m', '')
            | regex_findall('(?m)^' ~ (app | regex_escape) ~ ':\s+(\S+)')
            | first }}

    # Use the explicit input if provided, otherwise fall back to latest
    - name: Use latest version if version is empty
      ansible.builtin.set_fact:
        version: "{{ latest_version }}"
      when: version | default('') | length == 0

    - name: Fail if {{ app }} is not available
      ansible.builtin.fail:
        msg: "{{ app_name }} v{{ version }} not in binenv index (latest: v{{ latest_version }})"
      when: version not in (binenv_versions_raw.stdout | regex_replace('\x1b\[[0-9;]*m', ''))

    # Download the requested version (binenv does not switch the active version)
    - name: Install {{ app }}
      ansible.builtin.command:
        argv:
          - "{{ app_dir }}/binenv"
          - install
          - "{{ app }}"
          - "{{ version }}"

    - name: Install {{ app }}-keygen
      ansible.builtin.command:
        argv:
          - "{{ app_dir }}/binenv"
          - install
          - "{{ app }}-keygen"
          - "{{ version }}"

    - name: Show {{ app_name }} version
      ansible.builtin.debug:
        msg: "{{ app_name }} v{{ version }} is installed."

  when:
    - age | default(false) | bool
    - binenv | default(false) | bool
