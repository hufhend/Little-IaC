# Tracking container vulnerabilities with Clair Control
# Analyze your docker image with Clair, directly from your registry or local images
---
- name: Clairctl Variable Setting
  ansible.builtin.set_fact:
    app: "clairctl"
    app_name: "Clairctl"
    version: "{{ clairctl_version | default('', true) }}"
    installed_version: ""

- block:
    # Verify installed version
    - name: Check if {{ app_name }} is installed
      stat:
        path: "{{ app_dir }}/{{ app }}"
      register: app_installed

    - block:
        - name: Verify {{ app_name }} version
          ansible.builtin.command: "{{ app_dir }}/{{ app }} version"
          register: install_result
          changed_when: false
          check_mode: false

        - name: Extract and clean version
          ansible.builtin.set_fact:
            installed_version: "{{ (install_result.stdout | regex_search('version ([0-9.]+)', '\\1') | default([], true)) | first | default('', true) }}"
      when: app_installed.stat.exists

    # Discover the latest stable version
    - name: Get latest version from GitHub
      ansible.builtin.uri:
        url: "https://api.github.com/repos/jgsqware/clairctl/releases/latest"
        headers: '{{ ({"Authorization": "token " + github_token} if github_token is defined and github_token | length > 0 else {}) | to_json }}'
        return_content: true
        timeout: 30
      register: github_release
      changed_when: false
      run_once: true

    - name: Set latest version
      ansible.builtin.set_fact:
        latest_version: "{{ github_release.json.tag_name | default('') | regex_replace('^v', '') }}"

    # If a pinned version is not defined, it will be set to the latest version
    - name: Use latest version if version is empty
      ansible.builtin.set_fact:
        version: "{{ latest_version }}"
      when: version | default('') | length == 0

    # Version control reports the most significant changes in status
    - name: Show {{ app_name }} version
      ansible.builtin.debug:
        msg:
          - "Installed version: {{ installed_version }}"
          - "Requested version: {{ version }}"
      when: app_installed.stat.exists

    - name: Update available
      ansible.builtin.debug:
        msg: "{{ app_name }} v{{ latest_version }} is available! Consider updating."
      when:
        - installed_version is defined
        - installed_version | length > 0
        - latest_version is version(installed_version, '>')
        - version != latest_version
        - version is version(installed_version, '>=')

    - name: Upgrade to latest
      ansible.builtin.debug:
        msg: "{{ app_name }} v{{ version }} is available! Let's upgrade."
      when:
        - installed_version is defined
        - installed_version | length > 0
        - version is version(installed_version, '>')
        - version == latest_version

    - name: Downgrade detected
      ansible.builtin.debug:
        msg: "⚠️  {{ app_name }} does not allow downgrading to a lower version."
      when:
        - installed_version is defined
        - installed_version | length > 0
        - version is version(installed_version, '<')

    - name: Install detected
      ansible.builtin.debug:
        msg: "{{ app_name }} v{{ version }} is not installed. Let's install it."
      when:
        - installed_version | default('') | length == 0

    - name: Install
      block:
        # Download and verification steps
        - name: Detect platform
          ansible.builtin.set_fact:
            platform: "{{ ansible_facts['system'] | lower }}"

        - name: Detect architecture
          ansible.builtin.set_fact:
            arch: "{{ 'amd64' if '64' in ansible_facts['architecture'] else '386' }}"

        # Manual installation of a binary app
        - name: Download {{ app_name }} binary
          ansible.builtin.get_url:
            url: "https://s3.amazonaws.com/clairctl/latest/clairctl-{{ platform }}-{{ arch }}"
            dest: "{{ app_dir }}/{{ app }}"
            mode: "0755"

        # Show installed version
        - name: Verify {{ app_name }} version
          ansible.builtin.command: "{{ app_dir }}/{{ app }} version"
          register: install_result
          changed_when: false

        - name: Extract and clean version
          ansible.builtin.set_fact:
            clair_version: "{{ (install_result.stdout | regex_search('version ([0-9.]+)', '\\1') | default([], true)) | first | default('', true) }}"

        - name: Show {{ app_name }} version
          ansible.builtin.debug:
            msg: "{{ app_name }} v{{ clair_version }} is installed."

      when:
        - ansible_facts["system"] in ["Linux", "Darwin"]
        - ansible_facts["architecture"] in ["x86_64", "amd64"]
        - installed_version | default('') | length == 0 or version is version(installed_version, '>')
  when:
    - clairctl | default(false) | bool

# Unless requested, it will be uninstalled
- name: Remove {{ app_name }} by default
  ansible.builtin.file:
    path: "{{ app_dir }}/{{ app }}"
    state: absent
  when:
    - clairctl is defined
    - not (clairctl | bool)
