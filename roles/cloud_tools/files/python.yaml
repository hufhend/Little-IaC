# Python via DeadSnakes repo
---
- name: Python variable setting
  ansible.builtin.set_fact:
    app: "python3"
    app_name: "Python"

- name: Install {{ app_name }}
  when:
    - python | default(false) | bool
    - ansible_facts["distribution"] == "Ubuntu"
  block:
    - name: Add DeadSnakes GPG key
      ansible.builtin.get_url:
        url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF23C5A6CF475977595C89F51BA6932366A755776
        dest: /etc/apt/keyrings/deadsnakes.asc
        mode: "0644"

    - name: Add {{ app_name }} repository (deb822)
      ansible.builtin.deb822_repository:
        name: deadsnakes
        types: deb
        uris: https://ppa.launchpadcontent.net/deadsnakes/ppa/ubuntu/
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: main
        signed_by: /etc/apt/keyrings/deadsnakes.asc
        state: present
        enabled: true

    - name: Install {{ app_name }} package
      ansible.builtin.apt:
        name: "{{ app }}"
        state: present

    - name: Verify {{ app_name }} version
      ansible.builtin.command:
        cmd: "/usr/bin/{{ app }} --version"
      register: install_result
      changed_when: false
      failed_when: false

    - name: Extract and clean {{ app_name }} version
      ansible.builtin.set_fact:
        python_version: >-
          {{
            (install_result.stdout | default('')
             | regex_search('Python ([\d.]+)', '\1')
             | first)
            | default('unknown', true)
          }}

    - name: Show {{ app_name }} version
      ansible.builtin.debug:
        msg: "{{ app_name }} version is {{ python_version }}"
