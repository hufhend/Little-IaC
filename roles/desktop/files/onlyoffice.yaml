# OnlyOffice desktop editors
- name: Package Variable Setting
  ansible.builtin.set_fact:
    app: "onlyoffice"
    app_name: "OnlyOffice"

- name: Install {{ app_name }}
  block:
    - name: Add {{ app_name }} GPG key
      ansible.builtin.get_url:
        url: https://download.onlyoffice.com/GPG-KEY-ONLYOFFICE
        dest: /usr/share/keyrings/onlyoffice.asc
        mode: "0644"

    - name: Add {{ app_name }} repository
      ansible.builtin.deb822_repository:
        name: onlyoffice
        types: deb
        uris: https://download.onlyoffice.com/repo/debian
        suites: squeeze
        components: main
        signed_by: /usr/share/keyrings/onlyoffice.asc
        state: present

    - name: Install {{ app_name }}
      ansible.builtin.apt:
        name: onlyoffice-desktopeditors
        state: present
  when: onlyoffice == true
