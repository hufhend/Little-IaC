---
- name: Install Docker - containers for applications
  block:
  - name: Install required system packages
    ansible.builtin.apt:
      pkg:
        - ca-certificates
        - curl
      state: latest
      update_cache: true

  - name: Remove old Docker apt source (one-line format)
    ansible.builtin.file:
      path: /etc/apt/sources.list.d/docker.list
      state: absent
    ignore_errors: true

  - name: Ensure keyrings directory exists
    ansible.builtin.file:
      path: /usr/share/keyrings
      state: directory
      mode: '0755'

  - name: Download Docker GPG key
    ansible.builtin.get_url:
      url: https://download.docker.com/linux/ubuntu/gpg
      dest: /usr/share/keyrings/docker.asc
      mode: '0644'
      force: true

  - name: Map architecture
    ansible.builtin.set_fact:
      arch_map:
        x86_64: amd64
        amd64: amd64
        aarch64: arm64
        arm64: arm64
        armv7l: armhf
        armv6l: armhf

  - name: Set Docker architecture
    ansible.builtin.set_fact:
      docker_arch: "{{ arch_map.get(ansible_facts['architecture'], ansible_facts['architecture']) }}"

  - name: Add Docker repository as source
    ansible.builtin.deb822_repository:
      name: docker
      types: deb
      uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
      suites: "{{ ansible_facts['lsb']['codename'] }}"
      components: stable
      architectures: "{{ docker_arch }}"
      signed_by: /usr/share/keyrings/docker.asc
      state: present
      enabled: true

  - name: Add managed header to Docker sources file
    ansible.builtin.lineinfile:
      path: /etc/apt/sources.list.d/docker.sources
      line: "# {{ ansible_managed_header }}"
      insertbefore: BOF
      state: present

  - name: Update apt cache
    ansible.builtin.apt:
      update_cache: true
      cache_valid_time: 3600

  - name: Install Docker
    ansible.builtin.apt:
      pkg:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-compose-plugin
        - docker-buildx-plugin
      state: latest
      update_cache: true

  - name: Check if user is in docker group
    ansible.builtin.command: id -nG {{ ansible_user }}
    register: user_groups
    changed_when: false

  - name: Add current user to docker group
    ansible.builtin.user:
      name: "{{ docker_user }}"
      groups: docker
      append: yes

  - name: Create Docker daemon configuration
    block:
      - name: Read existing daemon.json
        ansible.builtin.slurp:
          src: /etc/docker/daemon.json
        register: daemon_raw
        ignore_errors: true

      - name: Parse existing config or create empty
        ansible.builtin.set_fact:
          daemon_config: "{{ (daemon_raw.content | b64decode | from_json) if daemon_raw is success else {} }}"

      - name: Define desired config
        ansible.builtin.set_fact:
          desired_config:
            log-driver: "{{ docker_log_driver | default('json-file') }}"
            log-opts:
              max-size: "{{ docker_log_max_size | default('10m') }}"
              max-file: "{{ docker_log_max_file | default('3') }}"
            default-address-pools: "{{ [{'base': docker_cgnat_base, 'size': docker_cgnat_size}] if docker_config | bool else [] }}"

      - name: Merge and write config
        ansible.builtin.copy:
          content: "{{ (daemon_config | combine(desired_config, recursive=true)) | to_nice_json }}"
          dest: /etc/docker/daemon.json
          owner: root
          group: root
          mode: '0644'
        notify: restart docker

      - name: Prune old Docker networks
        ansible.builtin.command: docker network prune -f
        ignore_errors: true
        changed_when: true

      - name: Show Docker network status
        ansible.builtin.debug:
          msg:
            - "Docker CGNAT configuration is ENABLED"
            - "Old unused networks pruned (active networks preserved)."
    when: docker_config | bool

  # Show installed version
  - name: Get Docker version
    ansible.builtin.command: docker version
    register: docker_version_result
    changed_when: false
    ignore_errors: true

  - name: Get Docker Compose version
    ansible.builtin.command: docker compose version
    register: docker_compose_version_result
    changed_when: false
    ignore_errors: true

  - name: Extract Docker versions
    ansible.builtin.set_fact:
      docker_client_version: "{{ docker_version_result.stdout | regex_search('Client:.*\\n Version:\\s+([\\d.]+)', '\\1') | default(['unknown']) | first }}"
      docker_engine_version: "{{ docker_version_result.stdout | regex_search('Engine:\\s*\\n\\s+Version:\\s+([\\d.]+)', '\\1') | default(['unknown'], true) | first }}"
      containerd_version: "{{ docker_version_result.stdout | regex_search('containerd:\\s*\\n\\s+Version:\\s+([\\w.]+)', '\\1') | default(['unknown'], true) | first }}"
      runc_version: "{{ docker_version_result.stdout | regex_search('runc:\\s*\\n\\s+Version:\\s+([\\d.]+)', '\\1') | default(['unknown'], true) | first }}"
      docker_init_version: "{{ docker_version_result.stdout | regex_search('docker-init:\\s*\\n\\s+Version:\\s+([\\d.]+)', '\\1') | default(['unknown'], true) | first }}"
      docker_compose_version: "{{ docker_compose_version_result.stdout | regex_search('Docker Compose version v([\\d.]+)', '\\1') | default(['unknown'], true) | first }}"
    when: docker_version_result is success and docker_compose_version_result is success

  - name: Show Docker versions
    ansible.builtin.debug:
      msg:
      - "Docker client: {{ docker_client_version }}"
      - "Docker engine: {{ docker_engine_version }}, containerd: {{ containerd_version }}, runc: {{ runc_version }}, docker-init: {{ docker_init_version }}, compose: {{ docker_compose_version }}"
    when: docker_version_result is success and docker_compose_version_result is success

  - name: Remove old Docker GPG key
    ansible.builtin.file:
      path: /usr/share/keyrings/docker.gpg
      state: absent
    ignore_errors: true

  when:
    - role not in ['combi', 'master', 'worker']
    - ansible_facts['os_family'] | lower == "debian"