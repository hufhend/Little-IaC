---
# Microsoft Edge browser
- name: Microsoft Edge Variable Setting
  ansible.builtin.set_fact:
    app: "edge"
    app_name: "Microsoft Edge"

- name: Install {{ app_name }}
  block:
  - name: Remove old Edge apt source (one-line format)
    ansible.builtin.file:
      path: /etc/apt/sources.list.d/microsoft-edge.list
      state: absent
    ignore_errors: true

  - name: Ensure keyrings directory exists
    ansible.builtin.file:
      path: /usr/share/keyrings
      state: directory
      mode: '0755'

  - name: Download Microsoft GPG key
    ansible.builtin.get_url:
      url: https://packages.microsoft.com/keys/microsoft.asc
      dest: /usr/share/keyrings/microsoft.asc
      mode: '0644'
      force: true

  - name: Add {{ app_name }} repository as DEB822 source
    ansible.builtin.deb822_repository:
      name: microsoft-edge
      types: deb
      uris: https://packages.microsoft.com/repos/edge
      suites: stable
      components: main
      architectures: amd64,arm64,armhf
      signed_by: /usr/share/keyrings/microsoft.asc
      state: present
      enabled: true

  - name: Add managed warning to {{ app }} sources file
    ansible.builtin.lineinfile:
      path: /etc/apt/sources.list.d/microsoft-edge.sources
      line: "# {{ ansible_managed_warning }}"
      insertbefore: BOF
      state: present

  - name: Add managed header to {{ app }} sources file
    ansible.builtin.lineinfile:
      path: /etc/apt/sources.list.d/microsoft-edge.sources
      line: "# {{ ansible_managed_header }}"
      insertbefore: BOF
      state: present

  - name: Update apt cache
    ansible.builtin.apt:
      update_cache: true
      cache_valid_time: 3600

  - name: Install {{ app_name }}
    ansible.builtin.apt:
      name: microsoft-edge-stable
      state: present

  when: edge == True
