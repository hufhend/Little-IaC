# Signal for Desktop
- name: Signal Variable Setting
  ansible.builtin.set_fact:
    app: "signal"
    app_name: "Signal"

- name: Install {{ app_name }} for Desktop
  block:
    - name: Add {{ app_name }} GPG key
      ansible.builtin.get_url:
        url: https://updates.signal.org/desktop/apt/keys.asc
        dest: /usr/share/keyrings/signal-desktop-keyring.asc
        mode: "0644"

    - name: Add {{ app_name }} repository
      ansible.builtin.deb822_repository:
        name: signal
        types: deb
        uris: https://updates.signal.org/desktop/apt
        suites: xenial
        components: main
        architectures: amd64
        signed_by: /usr/share/keyrings/signal-desktop-keyring.asc
        state: present

    - name: Install {{ app_name }} for Desktop
      ansible.builtin.apt:
        name: signal-desktop
        state: present
  when: signal == true
